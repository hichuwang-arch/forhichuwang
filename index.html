<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨Zoeeeeee的跟團紀錄✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen font-sans text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">✨Zoeeeeee的跟團紀錄✨</h1>
            <p class="text-gray-500">錢包痛苦！</p>
        </header>

        <!-- 總金額統計卡片 -->
        <div class="bg-white rounded-2xl shadow-md p-6 mb-8 flex flex-col sm:flex-row justify-around items-center border border-blue-100">
            <div class="text-center mb-4 sm:mb-0">
                <p class="text-sm text-gray-500">跟團總筆數</p>
                <p id="totalCount" class="text-2xl font-bold text-blue-600">0 筆</p>
            </div>
            <div class="h-10 w-px bg-gray-200 hidden sm:block"></div>
            <div class="text-center">
                <p class="text-sm text-gray-500">總花費金額 (含二補)</p>
                <p id="totalAmount" class="text-2xl font-bold text-indigo-600">NT$ 0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左側：新增/修改表單 -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-100 lg:col-span-1">
                <h2 id="formTitle" class="text-xl font-bold text-gray-700 mb-4 flex items-center">📝 新增跟團紀錄</h2>
                <form id="orderForm" class="space-y-4">
                    <input type="hidden" id="editId" value="">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">跟團日期</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">偶像 / 團體名稱</label>
                        <input type="text" id="groupName" placeholder="例如：Super Junior" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">品項名稱</label>
                        <input type="text" id="itemName" placeholder="例如：83z手燈" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">開團來源</label>
                        <input type="text" id="source" placeholder="例如：代購小幫手" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">金額</label>
                            <input type="text" id="amount" placeholder="例如：500 或 待定" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">二補金額</label>
                            <input type="number" id="secondAmount" placeholder="0" value="0" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">付款狀態</label>
                            <select id="payStatus" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                                <option value="已付款">已付款</option>
                                <option value="未付款">未付款</option>
                                <option value="已付款等待二補下單">已付款等待二補下單</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">物流狀態</label>
                            <select id="shipStatus" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                                <option value="待到貨">待到貨</option>
                                <option value="已收件">已收件</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">備註 (匯款後五碼、網址等)</label>
                        <textarea id="remark" rows="2" placeholder="例如：後五碼 12345" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none"></textarea>
                    </div>
                    <div class="flex space-x-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow-md">
                            送出跟團紀錄
                        </button>
                        <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-2 px-3 rounded-lg transition">
                            取消
                        </button>
                    </div>
                </form>
            </div>

            <!-- 右側：跟團清單列表 -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-100 lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-700">📋 我的跟團清單</h2>
                    <button onclick="loadData()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1 rounded-lg transition">重新整理</button>
                </div>
                
                <div id="loading" class="text-center py-10 text-gray-400">載入資料中...</div>

                <div class="overflow-x-auto hidden" id="tableContainer">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-blue-50 text-xs text-gray-600 uppercase">
                                <th class="p-3">日期/團體</th>
                                <th class="p-3">品項 / 來源</th>
                                <th class="p-3">金額 / 二補</th>
                                <th class="p-3">狀態</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody" class="text-sm divide-y">
                            <!-- 資料會透過 JavaScript 填入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwO1NkMRVwy2EEp5N3N9-MA7icAmZOxaMGV3kxTAg7yjyDewf8-PWcuW8lUxqIBtuT-LQ/exec';

        let allDataCache = [];

        document.getElementById('date').valueAsDate = new Date();

        window.onload = function() {
            loadData();
        };

        function loadData() {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');
            loading.style.display = 'block';
            tableContainer.classList.add('hidden');

            fetch(`${SCRIPT_URL}?action=getData`)
                .then(response => response.json())
                .then(data => {
                    allDataCache = data;
                    const tbody = document.getElementById('orderTableBody');
                    tbody.innerHTML = '';
                    
                    let totalCount = data.length;
                    let totalAmount = 0;

                    if (totalCount === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-400">目前沒有任何跟團紀錄喔！</td></tr>`;
                    } else {
                        data.forEach(item => {
                            let mainAmount = isNaN(Number(item.amount)) ? 0 : Number(item.amount);
                            let secondAmount = isNaN(Number(item.secondAmount)) ? 0 : Number(item.secondAmount);
                            totalAmount += (mainAmount + secondAmount);
                            
                            let payBadgeColor = item.payStatus === '已付款' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
                            let shipBadgeColor = item.shipStatus === '已收件' ? 'bg-blue-100 text-blue-700' : 'bg-indigo-100 text-indigo-700';

                            let amountDisplay = isNaN(Number(item.amount)) || item.amount === '' ? (item.amount || '待定') : `NT$ ${Number(item.amount).toLocaleString()}`;
                            let secondDisplay = secondAmount > 0 ? `<br><span class="text-xs text-purple-600">二補: NT$ ${secondAmount.toLocaleString()}</span>` : '';

                            let tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td class="p-3">
                                    <div class="text-xs text-gray-400">${item.date ? String(item.date).substring(0, 10) : ''}</div>
                                    <div class="font-bold text-blue-600">${item.groupName || ''}</div>
                                </td>
                                <td class="p-3">
                                    <div class="font-medium text-gray-800">${item.itemName || ''}</div>
                                    <div class="text-xs text-gray-500">${item.source || ''}</div>
                                    <div class="text-xs text-gray-400 truncate max-w-xs">備註: ${item.remark || '-'}</div>
                                </td>
                                <td class="p-3 font-semibold text-gray-700">
                                    ${amountDisplay}
                                    ${secondDisplay}
                                </td>
                                <td class="p-3 space-y-1">
                                    <span class="inline-block px-2 py-0.5 rounded text-xs ${payBadgeColor}">${item.payStatus || ''}</span><br>
                                    <span class="inline-block px-2 py-0.5 rounded text-xs ${shipBadgeColor}">${item.shipStatus || ''}</span>
                                </td>
                                <td class="p-3 text-center space-x-1">
                                    <button onclick="editItem('${item.id}')" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs px-2 py-1 rounded transition">修改</button>
                                    <button onclick="deleteItem('${item.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 text-xs px-2 py-1 rounded transition">刪除</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }

                    document.getElementById('totalCount').innerText = totalCount + ' 筆';
                    document.getElementById('totalAmount').innerText = 'NT$ ' + totalAmount.toLocaleString();

                    loading.style.display = 'none';
                    tableContainer.classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Error:', error);
                    loading.innerText = '載入資料失敗，請檢查網址或重新整理。';
                });
        }

        // 點擊修改按鈕
        function editItem(id) {
            const item = allDataCache.find(d => d.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('date').value = item.date ? String(item.date).substring(0, 10) : '';
            document.getElementById('groupName').value = item.groupName || '';
            document.getElementById('itemName').value = item.itemName || '';
            document.getElementById('source').value = item.source || '';
            document.getElementById('amount').value = item.amount || '';
            document.getElementById('secondAmount').value = item.secondAmount || 0;
            document.getElementById('payStatus').value = item.payStatus || '已付款';
            document.getElementById('shipStatus').value = item.shipStatus || '待到貨';
            document.getElementById('remark').value = item.remark || '';

            document.getElementById('formTitle').innerText = '✏️ 修改跟團紀錄';
            document.getElementById('submitBtn').innerText = '儲存修改';
            document.getElementById('cancelBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 取消修改
        function resetForm() {
            document.getElementById('orderForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('date').valueAsDate = new Date();
            document.getElementById('secondAmount').value = 0;
            document.getElementById('formTitle').innerText = '📝 新增跟團紀錄';
            document.getElementById('submitBtn').innerText = '送出跟團紀錄';
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        // 刪除資料
        function deleteItem(id) {
            if (!confirm('確定要刪除這筆跟團紀錄嗎？')) return;

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', id: id })
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    alert('🗑️ 刪除成功！');
                    loadData();
                } else {
                    alert('刪除失敗：' + result.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('發生錯誤，請稍後再試');
            });
        }

        // 表單送出（新增或修改）
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = editId ? '更新中...' : '儲存中...';

            const formData = {
                action: editId ? 'update' : 'create',
                id: editId,
                date: document.getElementById('date').value,
                groupName: document.getElementById('groupName').value,
                itemName: document.getElementById('itemName').value,
                source: document.getElementById('source').value,
                amount: document.getElementById('amount').value,
                secondAmount: document.getElementById('secondAmount').value || 0,
                payStatus: document.getElementById('payStatus').value,
                shipStatus: document.getElementById('shipStatus').value,
                remark: document.getElementById('remark').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    alert(editId ? '✨ 成功修改跟團紀錄！' : '✨ 成功新增跟團紀錄！');
                    resetForm();
                    loadData();
                } else {
                    alert('儲存失敗：' + result.message);
                }
                submitBtn.disabled = false;
                submitBtn.innerText = editId ? '儲存修改' : '送出跟團紀錄';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('發生錯誤，請稍後再試');
                submitBtn.disabled = false;
                submitBtn.innerText = editId ? '儲存修改' : '送出跟團紀錄';
            });
        });
    </script>
</body>
</html>
