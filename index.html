<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨Zoeeeeee的跟團紀錄✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen font-sans text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">✨Zoeeeeee的跟團紀錄✨</h1>
            <p class="text-gray-500">追星之路心靈富足但錢包極度痛苦rrrrr！</p>
        </header>

        <!-- 分頁切換與新增按鈕列 -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <!-- 分頁切換按鈕 -->
            <div class="flex space-x-4">
                <button onclick="switchTab('周邊')" id="tabPeripheral" class="px-6 py-2.5 rounded-xl font-bold text-base transition shadow-sm bg-blue-600 text-white">
                    📦 周邊紀錄
                </button>
                <button onclick="switchTab('票卷')" id="tabTicket" class="px-6 py-2.5 rounded-xl font-bold text-base transition shadow-sm bg-white text-gray-600 border border-blue-200 hover:bg-blue-50">
                    🎫 票卷紀錄
                </button>
            </div>

            <!-- 新增紀錄按鈕 -->
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-md transition flex items-center space-x-2">
                <span>➕ 新增紀錄</span>
            </button>
        </div>

        <!-- 全版面清單與極精簡總金額標籤 -->
        <div class="space-y-4">
            <div class="bg-white rounded-2xl shadow-md p-6 border border-blue-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="tableTitle" class="text-xl font-bold text-gray-700">📋 📦 周邊清單</h2>
                    <button onclick="loadData()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1 rounded-lg transition">重新整理</button>
                </div>
                
                <div id="loading" class="text-center py-10 text-gray-400">載入資料中...</div>

                <div class="overflow-x-auto hidden" id="tableContainer">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-blue-50 text-xs text-gray-600 uppercase">
                                <th class="p-3">日期/團體</th>
                                <th class="p-3">品項 / 來源</th>
                                <th class="p-3">金額 / 二補</th>
                                <th class="p-3">狀態</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody" class="text-base divide-y">
                            <!-- 資料會透過 JavaScript 填入 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 極精簡的總金額小標籤 -->
            <div class="bg-white rounded-lg shadow-sm py-2 px-4 inline-block ml-auto border border-blue-100 float-right">
                <div class="flex items-center space-x-3">
                    <span class="text-xs text-gray-500" id="statAmountTitle">周邊總花費</span>
                    <p id="totalAmount" class="text-lg font-bold text-indigo-600">NT$ ****</p>
                    <button onclick="toggleAmountVisibility()" id="toggleBtn" class="text-[10px] bg-gray-100 hover:bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded transition">
                        👁️ 顯示
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 彈跳視窗 (Modal) -->
    <div id="recordModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg border border-blue-100 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="formTitle" class="text-xl font-bold text-gray-700 flex items-center">📝 新增跟團紀錄</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="orderForm" class="space-y-4">
                <input type="hidden" id="editId" value="">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">記錄分類</label>
                    <select id="category" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                        <option value="周邊">📦 周邊</option>
                        <option value="票卷">🎫 票卷</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">跟團日期</label>
                    <input type="date" id="date" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">偶像 / 團體名稱</label>
                    <input type="text" id="groupName" placeholder="例如：Super Junior" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">品項名稱</label>
                    <input type="text" id="itemName" placeholder="例如：83z手燈 / 演唱會門票" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">開團來源</label>
                    <input type="text" id="source" placeholder="例如：代購小幫手 / 拓元" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">金額</label>
                        <input type="text" id="amount" placeholder="例如：500 或 待定" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">二補金額 (可空白)</label>
                        <input type="text" id="secondAmount" placeholder="例如：50 或 空白" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">付款狀態</label>
                        <select id="payStatus" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                            <option value="已付款">已付款</option>
                            <option value="未付款">未付款</option>
                            <option value="已付款等待二補下單">已付款等待二補下單</option>
                            <option value="已付款等待票卷序號">已付款等待票卷序號</option>
                            <option value="已付訂金">已付訂金</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">物流狀態</label>
                        <select id="shipStatus" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                            <option value="待到貨/待序號">待到貨/待序號</option>
                            <option value="已收件">已收件</option>
                            <option value="面交">面交</option>
                            <option value="票卷序號已給待取">票卷序號已給待取</option>
                            <option value="已取票">已取票</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">備註 (選填)</label>
                    <textarea id="remark" rows="2" placeholder="例如：座位號碼、後五碼" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none"></textarea>
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl transition duration-200 shadow-md">
                        確認送出
                    </button>
                    <button type="button" onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-xl transition">
                        取消
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwO1NkMRVwy2EEp5N3N9-MA7icAmZOxaMGV3kxTAg7yjyDewf8-PWcuW8lUxqIBtuT-LQ/exec';

        let allDataCache = [];
        let currentTab = '周邊';
        let isAmountVisible = false;
        let calculatedTotalAmount = 0;

        document.getElementById('date').valueAsDate = new Date();

        window.onload = function() {
            loadData();
        };

        // 開啟彈跳視窗 (新增模式)
        function openModal() {
            resetForm();
            document.getElementById('formTitle').innerText = '📝 新增跟團紀錄';
            document.getElementById('submitBtn').innerText = '確認送出';
            document.getElementById('category').value = currentTab;
            document.getElementById('recordModal').classList.remove('hidden');
        }

        // 關閉彈跳視窗
        function closeModal() {
            document.getElementById('recordModal').classList.add('hidden');
        }

        function toggleAmountVisibility() {
            isAmountVisible = !isAmountVisible;
            const totalAmountEl = document.getElementById('totalAmount');
            const toggleBtn = document.getElementById('toggleBtn');

            if (isAmountVisible) {
                totalAmountEl.innerText = 'NT$ ' + calculatedTotalAmount.toLocaleString();
                toggleBtn.innerText = '🔒 隱藏';
                toggleBtn.className = "text-[10px] bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-1.5 py-0.5 rounded transition";
            } else {
                totalAmountEl.innerText = 'NT$ ****';
                toggleBtn.innerText = '👁️ 顯示';
                toggleBtn.className = "text-[10px] bg-gray-100 hover:bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded transition";
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabPeripheral = document.getElementById('tabPeripheral');
            const tabTicket = document.getElementById('tabTicket');
            const tableTitle = document.getElementById('tableTitle');
            const statAmountTitle = document.getElementById('statAmountTitle');

            if (tab === '周邊') {
                tabPeripheral.className = "px-6 py-2.5 rounded-xl font-bold text-base transition shadow-sm bg-blue-600 text-white";
                tabTicket.className = "px-6 py-2.5 rounded-xl font-bold text-base transition shadow-sm bg-white text-gray-600 border border-blue-200 hover:bg-blue-50";
                tableTitle.innerText = "📋 📦 周邊清單";
                statAmountTitle.innerText = "周邊總花費";
            } else {
                tabTicket.className = "px-6 py-2.5 rounded-xl font-bold text-base transition shadow-sm bg-blue-600 text-white";
                tabPeripheral.className = "px-6 py-2.5 rounded-xl font-bold text-base transition shadow-sm bg-white text-gray-600 border border-blue-200 hover:bg-blue-50";
                tableTitle.innerText = "📋 🎫 票卷清單";
                statAmountTitle.innerText = "票卷總花費";
            }

            renderTable();
        }

        function loadData() {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');
            loading.style.display = 'block';
            tableContainer.classList.add('hidden');

            fetch(`${SCRIPT_URL}?action=getData`)
                .then(response => response.json())
                .then(data => {
                    // 自動依照日期由新到舊排序
                    data.sort((a, b) => new Date(b.date) - new Date(a.date));

                    allDataCache = data;
                    renderTable();
                })
                .catch(error => {
                    console.error('Error:', error);
                    loading.innerText = '載入資料失敗，請檢查網址或重新整理。';
                });
        }

        function renderTable() {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';

            const filteredData = allDataCache.filter(item => (item.category || '周邊') === currentTab);
            
            let totalCount = filteredData.length;
            calculatedTotalAmount = 0;

            if (totalCount === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-400">目前沒有${currentTab}紀錄喔！</td></tr>`;
            } else {
                filteredData.forEach(item => {
                    let mainAmount = isNaN(Number(item.amount)) ? 0 : Number(item.amount);
                    let secondAmount = isNaN(Number(item.secondAmount)) || item.secondAmount === '' ? 0 : Number(item.secondAmount);
                    calculatedTotalAmount += (mainAmount + secondAmount);
                    
                    let payBadgeColor = item.payStatus === '已付款' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
                    let shipBadgeColor = item.shipStatus === '已收件' ? 'bg-blue-100 text-blue-700' : 'bg-indigo-100 text-indigo-700';

                    let amountDisplay = isNaN(Number(item.amount)) || item.amount === '' ? (item.amount || '待定') : `NT$ ${Number(item.amount).toLocaleString()}`;
                    let secondDisplay = (item.secondAmount !== '' && item.secondAmount !== 0 && !isNaN(Number(item.secondAmount))) ? `<br><span class="text-sm text-purple-600">二補: NT$ ${Number(item.secondAmount).toLocaleString()}</span>` : '';

                    let remarkDisplay = (item.remark && item.remark.trim() !== '') ? `<div class="text-sm text-gray-500 mt-1">備註: ${item.remark}</div>` : '';

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-3 align-top">
                            <div class="text-xs text-gray-400">${item.date ? String(item.date).substring(0, 10) : ''}</div>
                            <div class="font-bold text-blue-600 text-lg">${item.groupName || ''}</div>
                        </td>
                        <td class="p-3 align-top">
                            <div class="font-medium text-gray-900">${item.itemName || ''}</div>
                            <div class="text-sm text-gray-500">${item.source || ''}</div>
                            ${remarkDisplay}
                        </td>
                        <td class="p-3 align-top font-semibold text-gray-700">
                            ${amountDisplay}
                            ${secondDisplay}
                        </td>
                        <td class="p-3 align-top space-y-1">
                            <span class="inline-block px-2 py-0.5 rounded text-xs ${payBadgeColor}">${item.payStatus || ''}</span><br>
                            <span class="inline-block px-2 py-0.5 rounded text-xs ${shipBadgeColor}">${item.shipStatus || ''}</span>
                        </td>
                        <td class="p-3 align-top text-center space-x-1">
                            <button onclick="editItem('${item.id}')" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs px-2.5 py-1.5 rounded transition">修改</button>
                            <button onclick="deleteItem('${item.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 text-xs px-2.5 py-1.5 rounded transition">刪除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            const totalAmountEl = document.getElementById('totalAmount');
            if (isAmountVisible) {
                totalAmountEl.innerText = 'NT$ ' + calculatedTotalAmount.toLocaleString();
            } else {
                totalAmountEl.innerText = 'NT$ ****';
            }

            loading.style.display = 'none';
            tableContainer.classList.remove('hidden');
        }

        // 點擊修改按鈕 (開啟彈窗並帶入資料)
        function editItem(id) {
            const item = allDataCache.find(d => d.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('category').value = item.category || '周邊';
            document.getElementById('date').value = item.date ? String(item.date).substring(0, 10) : '';
            document.getElementById('groupName').value = item.groupName || '';
            document.getElementById('itemName').value = item.itemName || '';
            document.getElementById('source').value = item.source || '';
            document.getElementById('amount').value = item.amount || '';
            document.getElementById('secondAmount').value = (item.secondAmount !== 0 && item.secondAmount !== '0') ? item.secondAmount : '';
            document.getElementById('payStatus').value = item.payStatus || '已付款';
            document.getElementById('shipStatus').value = item.shipStatus || '待到貨';
            document.getElementById('remark').value = item.remark || '';

            document.getElementById('formTitle').innerText = '✏️ 修改跟團紀錄';
            document.getElementById('submitBtn').innerText = '儲存修改';
            document.getElementById('recordModal').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('orderForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('category').value = currentTab;
            document.getElementById('date').valueAsDate = new Date();
            document.getElementById('secondAmount').value = '';
        }

        function deleteItem(id) {
            if (!confirm('確定要刪除這筆紀錄嗎？')) return;

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', id: id })
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    alert('🗑️ 刪除成功！');
                    loadData();
                } else {
                    alert('刪除失敗：' + result.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('發生錯誤，請稍後再試');
            });
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = editId ? '更新中...' : '儲存中...';

            const formData = {
                action: editId ? 'update' : 'create',
                id: editId,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                groupName: document.getElementById('groupName').value,
                itemName: document.getElementById('itemName').value,
                source: document.getElementById('source').value,
                amount: document.getElementById('amount').value,
                secondAmount: document.getElementById('secondAmount').value || '',
                payStatus: document.getElementById('payStatus').value,
                shipStatus: document.getElementById('shipStatus').value,
                remark: document.getElementById('remark').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    alert(editId ? '✨ 成功修改紀錄！' : '✨ 成功新增紀錄！');
                    closeModal();
                    loadData();
                } else {
                    alert('儲存失敗：' + result.message);
                }
                submitBtn.disabled = false;
                submitBtn.innerText = editId ? '儲存修改' : '確認送出';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('發生錯誤，請稍後再試');
                submitBtn.disabled = false;
                submitBtn.innerText = editId ? '儲存修改' : '確認送出';
            });
        });
    </script>
</body>
</html>
